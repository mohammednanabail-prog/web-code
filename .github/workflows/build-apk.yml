name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate and Build Android Project
        run: |
          echo "Scanning directory for build system..."
          ROOT_DIR=$(pwd)
          GRADLE_FILE=$(find . -maxdepth 4 -name "build.gradle*" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: No build.gradle file found in repository!"
            exit 1
          fi

          TARGET_DIR=$(dirname "$GRADLE_FILE")
          echo "Moving into project directory: $TARGET_DIR"
          cd "$TARGET_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace
          elif [ -f "../gradlew" ]; then
            chmod +x ../gradlew
            ../gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Release APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: 'Android APK Release'
          files: '**/build/outputs/apk/debug/*.apk'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
